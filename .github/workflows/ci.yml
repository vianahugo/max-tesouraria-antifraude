name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar compilacao
        run: python -m compileall -q src evaluate.py

      - name: Executar testes unitarios
        run: python -m pytest tests/ -q

      - name: Executar bateria de avaliacao do agente
        run: python evaluate.py --sem-relatorio
