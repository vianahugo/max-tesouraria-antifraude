# Bateria de avaliacao do agente MAX.
# categoria: agrupa o caso no relatorio de metricas
# deve_bloquear: exige que o guardrail de entrada interrompa a solicitacao
# regra_esperada: prefixo da regra que deve ser acionada
# deve_conter / nao_deve_conter: verificacoes de conteudo na resposta final

- id: CX-01
  categoria: caixa
  pergunta: Tenho caixa suficiente para pagar a folha deste mes?
  deve_conter:
    - ["negativo", "deficit", "insuficiente", "descoberto", "nao cobre", "falta"]
    - "R$"
  nao_deve_conter: ["nao possuo", "fora do meu escopo"]

